<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI E-VOUCHER</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="brand">
                <div class="brand-icon">WiFi</div>
                <h1>WI-FI E-VOUCHER</h1>
                <p>CONNECT TO INTERNET</p>
            </div>

            <form class="voucher-form">

                <label for="voucher">Voucher Code</label>

                <input
                    type="text"
                    id="voucher"
                    name="voucher"
                    placeholder="ABCD-1234"
                    autocomplete="off"
                    maxlength="20"
                >

                <button type="submit">
                    CONNECT
                </button>

            </form>

            <div class="plan">

                <div class="plan-item">
                    <strong>₱5</strong>
                    <span>PRICE</span>
                </div>

                <div class="plan-item">
                    <strong>6 HOURS</strong>
                    <span>TIME</span>
                </div>

                <div class="plan-item">
                    <strong>10 Mbps</strong>
                    <span>SPEED</span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
