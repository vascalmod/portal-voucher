<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI E-VOUCHER</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="brand">
                <div class="brand-icon">WiFi</div>
                <h1>WI-FI E-VOUCHER</h1>
                <p>CONNECT TO INTERNET</p>
            </div>

            <form class="voucher-form">

                <label for="voucher">Voucher Code</label>

                <input
                    type="text"
                    id="voucher"
                    name="voucher"
                    placeholder="ABCD-1234"
                    autocomplete="off"
                    maxlength="20"
                >

                <button type="submit">
                    CONNECT
                </button>

            </form>

            <div class="rates">

                <p class="rates-caption">10 Mbps &mdash; ALL VOUCHERS</p>

                <div class="rates-grid">

                    <div class="rate-card">
                        <strong>₱5</strong>
                        <span>8 Hours</span>
                    </div>

                    <div class="rate-card">
                        <strong>₱10</strong>
                        <span>16 Hours</span>
                    </div>

                    <div class="rate-card">
                        <strong>₱20</strong>
                        <span>36 Hours (1.5 Days)</span>
                    </div>

                    <div class="rate-card">
                        <strong>₱50</strong>
                        <span>4 Days (96 Hours)</span>
                    </div>

                    <div class="rate-card">
                        <strong>₱100</strong>
                        <span>9 Days</span>
                    </div>

                    <div class="rate-card">
                        <strong>₱200</strong>
                        <span>19 Days</span>
                    </div>

                    <div class="rate-card rate-wide">
                        <strong>₱500</strong>
                        <span>30 Days (1 Month)</span>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
