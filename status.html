<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Status</title>
    <link rel="icon" type="image/png" href="favicon-64.png">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="brand">
                <div class="brand-icon">WiFi</div>
                <h1>WI-FI E-VOUCHER</h1>

                <div class="connection-status">
                    <span class="status-dot"></span>
                    CONNECTED
                </div>
            </div>

            <div class="timer-section">

                <span class="timer-label">REMAINING</span>

                <div class="timer">
                    05:42:17
                </div>

            </div>

            <div class="voucher-info">

                <div class="info-row">
                    <span>Voucher</span>
                    <strong>ABCD-1234</strong>
                </div>

                <div class="info-row">
                    <span>Speed</span>
                    <strong>10 Mbps</strong>
                </div>

                <div class="info-row">
                    <span>Status</span>
                    <strong class="active-text">Active</strong>
                </div>

            </div>

            <button class="pause-button" type="button">
                PAUSE
            </button>

            <p class="hint">
                Your remaining time is preserved when paused.
            </p>

        </section>

    </main>

</body>
</html>
